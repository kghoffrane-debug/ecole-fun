spring.application.name=ecole-fun
server.port=${PORT:8080}

# Base de données locale (H2 fichier) - voir application-prod.properties pour PostgreSQL
spring.datasource.url=jdbc:h2:file:./data/ecoledb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
spring.web.locale=fr
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Paramètres de l'école
app.annee-scolaire=2026-2027
app.default-tuition=1200
app.seed-demo=true
app.admin-password=admin123
