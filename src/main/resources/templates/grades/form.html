<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments :: head('Note')}"></head>
<body>
<nav th:replace="~{fragments :: nav('grades')}"></nav>
<main class="wrap">
  <div th:replace="~{fragments :: flash}"></div>
  <h1 th:text="${g.id == null} ? '⭐ Nouvelle note' : '✏️ Modifier la note'">Note</h1>

  <div class="card">
    <form class="fun" method="post" th:action="@{/grades/save}">
      <input type="hidden" name="id" th:value="${g.id}">
      <label>Élève
        <select name="studentId" required>
          <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.avatar} + ' ' + ${s.fullName}"
                  th:selected="${g.student != null and g.student.id == s.id}">Élève</option>
        </select>
      </label>
      <label>Matière
        <select name="subjectId" required>
          <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}"
                  th:selected="${g.subject != null and g.subject.id == s.id}">Maths</option>
        </select>
      </label>
      <label>Évaluation (contrôle, examen…)
        <input type="text" name="title" th:value="${g.title}" required>
      </label>
      <label>Note sur 20
        <input type="number" name="score" step="0.25" min="0" max="20" th:value="${g.id != null} ? ${g.score}" required>
      </label>
      <label>Trimestre
        <select name="trimester">
          <option th:each="t : ${#numbers.sequence(1, 3)}" th:value="${t}" th:text="'Trimestre ' + ${t}"
                  th:selected="${t == g.trimester}">Trimestre 1</option>
        </select>
      </label>
      <div class="actions">
        <button class="btn" type="submit">💾 Enregistrer</button>
        <a class="btn ghost" th:href="@{/grades}">Annuler</a>
      </div>
    </form>
  </div>
</main>
<script th:src="@{/js/fun.js}"></script>
</body>
</html>
