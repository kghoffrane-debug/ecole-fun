<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="fr">
<head th:replace="~{fragments :: head('Fiche élève')}"></head>
<body>
<nav th:replace="~{fragments :: nav('students')}"></nav>
<main class="wrap">
  <div th:replace="~{fragments :: flash}"></div>

  <section class="hero" style="background:var(--grape)">
    <div class="mascot" th:text="${s.avatar}">🦊</div>
    <div>
      <h1 th:text="${s.fullName}">Nom</h1>
      <p th:text="${s.schoolClass != null} ? ${s.schoolClass.label} + ' · ' + ${s.anneeScolaire} : 'Sans classe'">CE1 A</p>
      <div class="stars">
        <span th:each="i : ${#numbers.sequence(1, 3)}" th:class="${i <= progress.stars} ? 'on' : 'off'">⭐</span>
      </div>
    </div>
  </section>

  <div class="card">
    <h2 style="margin-top:0">🏅 Mes badges</h2>
    <div class="chips">
      <span class="chip" th:each="b : ${progress.badges}" th:text="${b}">🌟 Badge</span>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-top:0">📚 Mes matières</h2>
    <p th:if="${progress.average != null}">Moyenne générale :
      <span class="big-num" th:text="${#numbers.formatDecimal(progress.average, 1, 'WHITESPACE', 2, 'COMMA')} + ' / 20'">15 / 20</span></p>
    <p class="muted" th:if="${progress.average == null}">Pas encore de note.</p>
    <div th:each="r : ${progress.rows}" style="margin-bottom:12px">
      <div class="actions" style="justify-content:space-between">
        <b th:text="${r.subject.name}">Maths</b>
        <span th:text="${#numbers.formatDecimal(r.average, 1, 'WHITESPACE', 2, 'COMMA')} + ' / 20'">15 / 20</span>
      </div>
      <div class="bar"><i th:style="'width:' + ${r.average * 5} + '%'"></i></div>
    </div>
    <div class="actions no-print">
      <a class="btn sun" th:href="@{/students/{id}/bulletin(id=${s.id})}">📄 Voir le bulletin</a>
      <a class="btn grape" sec:authorize="hasAnyRole('ADMIN','TEACHER')"
         th:href="@{/grades/new(studentId=${s.id})}">⭐ Ajouter une note</a>
    </div>
  </div>

  <div class="card" sec:authorize="hasAnyRole('ADMIN','ACCOUNTANT','PARENT')">
    <h2 style="margin-top:0">💰 Paiements</h2>
    <p>
      <span th:if="${balance.signum() > 0}" class="pill-due"
            th:text="'Solde restant : ' + ${#numbers.formatDecimal(balance, 1, 'WHITESPACE', 2, 'COMMA')} + ' DT'">Solde</span>
      <span th:unless="${balance.signum() > 0}" class="pill-ok">Tout est réglé 🎉</span>
    </p>
    <table th:if="${!#lists.isEmpty(payments)}">
      <thead><tr><th>Date</th><th>Montant</th><th>Mode</th><th>Reçu</th></tr></thead>
      <tbody>
      <tr th:each="p : ${payments}">
        <td th:text="${#temporals.format(p.paidAt, 'dd/MM/yyyy')}">01/01/2026</td>
        <td th:text="${p.amount} + ' DT'">100 DT</td>
        <td th:text="${p.method.label}">Espèces</td>
        <td><a th:href="@{/payments/{id}/receipt(id=${p.id})}" th:text="${p.receiptNumber}">R-2026-00001</a></td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="card" sec:authorize="hasAnyRole('ADMIN','TEACHER','ACCOUNTANT')" th:if="${s.medicalNotes != null and !s.medicalNotes.isBlank()}">
    <h2 style="margin-top:0">🩺 Remarques médicales</h2>
    <p th:text="${s.medicalNotes}">RAS</p>
  </div>
</main>
<script th:src="@{/js/fun.js}"></script>
</body>
</html>
