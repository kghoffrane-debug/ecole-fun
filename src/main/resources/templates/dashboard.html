<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="fr">
<head th:replace="~{fragments :: head('Accueil')}"></head>
<body>
<nav th:replace="~{fragments :: nav('home')}"></nav>
<main class="wrap">
  <div th:replace="~{fragments :: flash}"></div>

  <section class="hero">
    <div class="mascot" title="Clique-moi !">🦉</div>
    <div>
      <h1>Bonjour <span th:text="${me.fullName}">Prénom</span> !</h1>
      <p>Prêt(e) pour une super journée d'école ? Année <span th:text="${annee}">2026-2027</span> 🌈</p>
    </div>
  </section>

  <section class="grid cols3">
    <div class="stat sun"><b th:text="${studentCount}">0</b><span>🧒 Élèves</span></div>
    <div class="stat mint"><b th:text="${classCount}">0</b><span>🏫 Classes</span></div>
    <div class="stat grape"><b th:text="${unread}">0</b><span>💌 Messages non lus</span></div>
    <div class="stat coral" sec:authorize="hasAnyRole('ADMIN','ACCOUNTANT')">
      <b th:text="${#numbers.formatDecimal(unpaidTotal, 1, 'WHITESPACE', 0, 'COMMA')} + ' DT'">0 DT</b>
      <span>⏰ Impayés</span>
    </div>
  </section>

  <h2>Raccourcis rigolos</h2>
  <div class="actions">
    <a class="btn sun" sec:authorize="hasAnyRole('ADMIN','ACCOUNTANT')" th:href="@{/students/new}">➕ Nouvel élève</a>
    <a class="btn grape" sec:authorize="hasAnyRole('ADMIN','TEACHER')" th:href="@{/grades/new}">⭐ Saisir une note</a>
    <a class="btn coral" sec:authorize="hasAnyRole('ADMIN','ACCOUNTANT')" th:href="@{/payments/new}">💰 Encaisser</a>
    <a class="btn sky" th:href="@{/messages/compose}">✏️ Écrire un message</a>
  </div>
</main>
<script th:src="@{/js/fun.js}"></script>
</body>
</html>
