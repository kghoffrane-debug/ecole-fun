<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="fr">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4d96ff">
  <title th:text="${title} + ' · École Fun'">École Fun</title>
  <link rel="manifest" th:href="@{/manifest.json}">
  <link rel="icon" th:href="@{/img/owl.svg}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/fun.css}">
</head>
<body>

<nav class="topbar" th:fragment="nav(active)">
  <a class="brand" th:href="@{/}"><span class="owl">🦉</span> École Fun</a>
  <div class="links">
    <a th:href="@{/}" th:classappend="${active == 'home'} ? 'on'" class="c-sun">🏠 Accueil</a>
    <a sec:authorize="hasAnyRole('ADMIN','TEACHER','ACCOUNTANT')" th:href="@{/students}"
       th:classappend="${active == 'students'} ? 'on'" class="c-coral">🧒 Élèves</a>
    <a sec:authorize="hasAnyRole('ADMIN','TEACHER')" th:href="@{/classes}"
       th:classappend="${active == 'classes'} ? 'on'" class="c-sky">🏫 Classes</a>
    <a sec:authorize="hasAnyRole('ADMIN','TEACHER')" th:href="@{/subjects}"
       th:classappend="${active == 'subjects'} ? 'on'" class="c-mint">📚 Matières</a>
    <a sec:authorize="hasAnyRole('ADMIN','TEACHER')" th:href="@{/grades}"
       th:classappend="${active == 'grades'} ? 'on'" class="c-grape">📝 Notes</a>
    <a sec:authorize="hasAnyRole('ADMIN','ACCOUNTANT')" th:href="@{/payments}"
       th:classappend="${active == 'payments'} ? 'on'" class="c-sun">💰 Paiements</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}"
       th:classappend="${active == 'users'} ? 'on'" class="c-coral">👥 Comptes</a>
    <a th:href="@{/messages}" th:classappend="${active == 'messages'} ? 'on'" class="c-sky">💌 Messages
      <span class="badge" th:if="${unread != null and unread > 0}" th:text="${unread}">1</span></a>
  </div>
  <form th:action="@{/logout}" method="post" class="logout">
    <span th:if="${me != null}" th:text="${me.fullName}">Utilisateur</span>
    <button class="btn small coral" type="submit">Sortir 👋</button>
  </form>
</nav>

<div th:fragment="flash">
  <div class="flash ok" th:if="${ok}" th:text="${ok}">Bravo !</div>
  <div class="flash err" th:if="${err}" th:text="${err}">Oups !</div>
</div>

</body>
</html>
